# Scheduled Workflow
# Uruchamia security scan codziennie o 3:00 UTC
# oraz pozwala uruchomić go ręcznie.

name: Zadanie 17 - Security Scan

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Uruchom security scan
        run: |
          pip-audit -r requirements.txt